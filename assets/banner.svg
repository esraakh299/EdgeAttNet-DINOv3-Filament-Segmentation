<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="EdgeAttNet: Solar Filament Instance Segmentation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#1a1145"/>
      <stop offset="1" stop-color="#3b1a5e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ff5e3a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd089"/>
    </linearGradient>
    <linearGradient id="fil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d4d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5e3a" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="90" cy="48" r="1.4"/><circle cx="210" cy="270" r="1.2"/>
    <circle cx="340" cy="30" r="1"/><circle cx="520" cy="285" r="1.5"/>
    <circle cx="610" cy="40" r="1.1"/><circle cx="740" cy="250" r="1"/>
    <circle cx="460" cy="70" r="1"/><circle cx="150" cy="150" r="1"/>
  </g>

  <!-- sun glow -->
  <circle cx="1010" cy="160" r="270" fill="url(#sun)"/>
  <circle cx="1010" cy="160" r="92" fill="#ffd27a" opacity="0.95"/>
  <circle cx="1010" cy="160" r="92" fill="none" stroke="#fff3c4" stroke-opacity="0.6" stroke-width="2"/>

  <!-- filaments -->
  <g fill="none" stroke="url(#fil)" stroke-linecap="round">
    <path d="M700 230 C 790 150, 860 220, 950 150 S 1090 110, 1160 150" stroke-width="5"/>
    <path d="M720 120 C 800 70, 880 130, 960 90 S 1100 200, 1170 210" stroke-width="3.5"/>
    <path d="M760 280 C 830 230, 900 270, 990 225 S 1110 250, 1180 240" stroke-width="2.5"/>
  </g>

  <!-- text -->
  <text x="70" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="url(#title)" letter-spacing="1">EdgeAttNet</text>
  <text x="74" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#ffb86b">Solar Filament Instance Segmentation</text>
  <rect x="74" y="222" width="260" height="38" rx="19" fill="#ffffff" fill-opacity="0.12" stroke="#ffb86b" stroke-opacity="0.7"/>
  <text x="204" y="247" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">IEEE Big Data Cup 2026</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
